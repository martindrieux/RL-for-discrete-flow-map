# Conditional pretraining: the question `ab+cd=` is given, the flow map generates the 3-digit answer.
seed: 0
out_dir: runs/arith_cond_pretrain
task: {name: arithmetic, n_digits: 2, frac_correct: 1.0, holdout_frac: 0.1, holdout_seed: 0}
cond: {mode: state, enc_depth: 2}   # state: question as clean one-hot rows; encoder: separate encoder
model: {dim: 128, depth: 4, heads: 4, time_warp: true}
train:
  steps: 200000
  batch_size: 256
  lr: 3.0e-4
  warmup: 500
  ema: 0.999
  grad_clip: 1.0
  log_every: 500
  eval_every: 5000
eval: {Ks: [1, 2, 4, 8], n: 1000, seed: 1234}
track:
  nb: false
  subproject: pretrain-arith-cond
  algo: fmlm-direct
  question: "Given the question ab+cd=, does the flow map learn to generate the correct sum, including on held-out questions?"
