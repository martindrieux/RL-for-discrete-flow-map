# Sudoku 9x9: the puzzle (81 cells, 0 = blank) is given; the model writes the 81 cells of the solution.
# Unique solutions; blanks per puzzle b ~ U{min_blanks, ..., min(max_blanks, |R|)} with |R| ~ 55-59 (see rlfm/data/sudoku.py).
seed: 0
out_dir: runs/sudoku_pretrain
task: {name: sudoku, n_train: 50000, n_heldout: 1000, min_blanks: 30, max_blanks: 81}
cond: {mode: state, enc_depth: 2}
model: {dim: 256, depth: 6, heads: 8, time_warp: true}
train:
  steps: 100000
  batch_size: 256
  lr: 3.0e-4
  warmup: 500
  ema: 0.999
  grad_clip: 1.0
  log_every: 500
  eval_every: 2500
eval: {Ks: [1, 2, 4, 8], n: 1000, seed: 1234}
keep_ckpts: true
track:
  nb: false
  subproject: pretrain-sudoku
  algo: fmlm-direct
  question: "Given a 9x9 Sudoku puzzle with a unique solution, do the flow map and an autoregressive transformer of the same size learn to write the solution, on puzzles from held-out grids?"
