# Countdown: four 2-digit numbers and a 3-digit target are given; the flow map generates a 7-token postfix expression.
seed: 0
out_dir: runs/countdown_pretrain
task: {name: countdown, holdout_frac: 0.1, holdout_seed: 0, max_num: 99, max_target: 999}
cond: {mode: state, enc_depth: 2}
model: {dim: 256, depth: 6, heads: 8, time_warp: true}
train:
  steps: 100000
  batch_size: 256
  lr: 3.0e-4
  warmup: 500
  ema: 0.999
  grad_clip: 1.0
  log_every: 500
  eval_every: 2500
eval: {Ks: [1, 2, 4, 8], n: 1000, seed: 1234}
track:
  nb: false
  subproject: pretrain-countdown
  algo: fmlm-direct
  question: "Given four numbers and a target, does the flow map learn to write expressions that reach the target, on held-out number sets?"
