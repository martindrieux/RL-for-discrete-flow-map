# Pretraining on 2-digit arithmetic: half the equations have the right sum.
seed: 0
out_dir: runs/arith_pretrain
task: {name: arithmetic, n_digits: 2, frac_correct: 0.5}
model: {dim: 128, depth: 4, heads: 4, time_warp: true}
train:
  steps: 20000
  batch_size: 256
  lr: 3.0e-4
  warmup: 500
  ema: 0.999
  grad_clip: 1.0
  log_every: 100
  eval_every: 2000
eval: {Ks: [1, 2, 4, 8], n: 2000, seed: 1234}
track:
  nb: false
  subproject: pretrain-arith
  algo: fmlm-direct
  title: "FMLM direct training, uniform in tau"
  formula: "$\\mathcal{L} = -x_1 \\cdot \\log\\hat\\delta_{t,t}(I_t) - \\bar\\delta \\cdot \\log\\hat\\delta_{s,t}(I_s)$, $\\tau \\sim \\mathcal{U}[0,1]$, $B = \\cfg{train.batch_size}$"
  question: "Does direct FMLM training give a 1-jump sampler that writes well-formed equations with the data's fraction of correct sums?"
